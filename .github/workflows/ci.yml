name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tlc
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tlc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @tlc/shared typecheck
      - run: pnpm --filter @tlc/shared test
      - run: pnpm --filter @tlc/database typecheck
      - run: pnpm --filter @tlc/database test
      - run: pnpm --filter @tlc/api typecheck
      - run: pnpm --filter @tlc/api test
      - run: pnpm --filter @tlc/api build
      - run: pnpm --filter @tlc/mobile typecheck
