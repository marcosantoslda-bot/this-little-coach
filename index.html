<style>
/* This Little Coach — tema monocromático (preto e branco) */
:root{
  color-scheme: light;
  --surface:#FFFFFF; --page:#FFFFFF; --card:#FFFFFF;
  --ink:#000000; --ink2:#4A4A4A; --muted:#7A7A7A;
  --grid:#EEEEEE; --axis:#CCCCCC; --border:#E5E5E5;
  --accent:#000000; --accent2:#666666; --accent-soft:#F2F2F2;
  --rosa:#333333; --azul:#666666; --verde:#666666; --amarelo:#999999; --carvao:#000000;
  --energy:#333333; --energy-soft:#F2F2F2;
  --s1:#000000; --good:#000000; --warn:#4A4A4A; --bad:#000000;
  --hgrad:#F2F2F2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#FFFFFF}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--page);color:var(--ink);
  font-size:15px;line-height:1.45;padding-bottom:72px}
.lw b, .lw{font-weight:400}
a{color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:var(--card);padding:10px 16px 8px;border-bottom:1px solid var(--border)}
header .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
header .brand{font-size:14px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
header .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{padding:12px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card.journey{border:1.5px solid var(--ink)}
.journey .jstats{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}
.journey .jstats b{font-size:16px;display:block;color:var(--ink)}
.mascot{transition:all 1s ease}
.card h2{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{font-size:12px;color:var(--ink2);display:block;margin-bottom:4px}
input,select{width:100%;padding:10px 12px;min-height:44px;border:1px solid var(--axis);border-radius:10px;background:#FFFFFF;
  color:var(--ink);font-size:16px;font-family:inherit}
input[type=number]{-moz-appearance:textfield}
input[type=checkbox]{min-height:0;width:18px;height:18px;accent-color:#000000}
button{border:1px solid #000000;border-radius:12px;padding:10px 16px;min-height:48px;font-size:15px;font-weight:600;cursor:pointer;
  background:#000000;color:#FFFFFF;font-family:inherit;line-height:1.2}
button.ghost{background:#FFFFFF;color:#000000}
button.mini{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
button.danger{background:#FFFFFF;color:var(--muted);border-color:var(--border)}
.stat{display:flex;flex-direction:column;gap:2px;background:#FFFFFF;border:1px solid var(--border);
  border-radius:10px;padding:10px}
.stat .lb{font-size:11px;color:var(--muted)}
.stat .vl{font-size:22px;font-weight:700}
.stat .dl{font-size:11px;color:var(--ink2)}
.meter{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px;background:#000000;transition:width .6s ease}
.meter i.over{background:repeating-linear-gradient(45deg,#000000 0 4px,#FFFFFF 4px 8px)}
.foodline{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:14px}
.foodline:last-child{border-bottom:none}
.foodline .fi{flex:1}
.foodline .fk{color:var(--muted);font-size:12px;margin-right:4px;white-space:nowrap}
.chip{display:inline-block;background:#FFFFFF;color:#000000;font-size:13px;font-weight:500;min-height:0;
  padding:8px 12px;border-radius:999px;margin:0 6px 6px 0;cursor:pointer;border:1px solid var(--axis)}
.chip.on{background:#000000;color:#FFFFFF;border-color:#000000}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#FFFFFF;border-top:1px solid var(--border);
  z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;border-top:2px solid transparent;border-radius:0;color:var(--muted);
  font-size:12px;font-weight:600;padding:12px 2px 10px;min-height:0;margin-top:-1px}
nav button.on{color:#000000;border-top-color:#000000}
.ex{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:#FFFFFF}
.pict{width:62px;height:48px;color:#000000;flex-shrink:0;background:var(--accent-soft);border-radius:10px;padding:3px}
.pict line,.pict path,.pict polyline,.pict rect,.pict circle{stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pict .f{fill:currentColor;stroke:none}
.pict .eq{opacity:.45}
.ex .xh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex .xn{font-weight:700;font-size:14px}
.ex .xt{font-size:12px;color:var(--ink2);font-weight:700;white-space:nowrap}
.ex .xm{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.ex .last{font-size:11.5px;color:var(--ink2);background:var(--accent-soft);border-radius:8px;padding:4px 8px;margin-bottom:6px;display:inline-block}

<body>
<header>
  <div class="hrow"><div class="brand">this little coach</div><div id="userBar" style="flex-shrink:0"></div></div>
  <div class="sub" id="hSub">94,2 kg → 86–87 kg · 2 600 kcal · 195 g proteína</div>
</header>
<div class="wrap">
  <div class="banner" id="storageBanner">Abre este ficheiro no Chrome e "Adiciona ao ecrã principal" para os dados ficarem guardados.</div>
  <div id="view"></div>
</div>
<nav id="nav"></nav>

<script>
'use strict';
/* ============ STORAGE ============ */
var MEM = {};
var canStore = false;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); canStore = true; }
catch(e){ document.getElementById('storageBanner').style.display='block'; }
var APPV='v18';
var CFGDEF = {kcal:2600, prot:195, steps:8000, target:86.5, water:3.0, waterRem:false, mode:'normal'};
function initUser(u){
  u.days=u.days||{}; u.workouts=u.workouts||{}; u.custom=u.custom||[]; u.photos=u.photos||[]; u.cfg=u.cfg||{};
  for(var ck in CFGDEF){ if(u.cfg[ck]==null) u.cfg[ck]=CFGDEF[ck]; }
  if(u.cfg.steps===7000||u.cfg.steps===10000) u.cfg.steps=8000; // 8 000 = mínimo eficaz (SCIENCE.md)
  u.cfg.techOk=u.cfg.techOk||{}; // checklist "Técnica primeiro" (jovem), por exercício
  if(u.cfg.profile&&u.cfg.profile.pelvic==null) u.cfg.profile.pelvic=false;
  return u;
}
function loadRoot(){
  if(canStore){ try{
    var v2=localStorage.getItem('plano1213v2');
    if(v2) return JSON.parse(v2);
    var v1=localStorage.getItem('plano1213'); // migração de versões antigas
    if(v1) return {active:'A', users:{A:JSON.parse(v1)}};
    return {};
  }catch(e){ return {}; } }
  return MEM;
}
var ROOT = loadRoot();
ROOT.users = ROOT.users || {A:{}};
ROOT.active = (ROOT.active && ROOT.users[ROOT.active]) ? ROOT.active : 'A';
for(var uk in ROOT.users) initUser(ROOT.users[uk]);
var DB = ROOT.users[ROOT.active]; // "DB" é sempre a pessoa ativa
function save(){
  if(canStore){ try{ localStorage.setItem('plano1213v2', JSON.stringify(ROOT)); }catch(e){} }
  else MEM = ROOT;
}
var USER_IDS=['A','B','C']; // até 3 pessoas (família): A/B antigos continuam a funcionar
function userName(id){
  var u=ROOT.users[id];
  return (u&&u.cfg.profile&&u.cfg.profile.name)?u.cfg.profile.name:('Pessoa '+id);
}
function otherIds(){ return USER_IDS.filter(function(id){ return ROOT.users[id]&&id!==ROOT.active; }); }
function otherId(){ return otherIds()[0]||(ROOT.active==='A'?'B':'A'); }
/* pessoas com quem se partilham refeições (o jovem não conta calorias, por isso fica de fora) */
function shareIds(){ return otherIds().filter(function(id){ return !isYouth(ROOT.users[id]); }); }
function shareLabel(){ return shareIds().length>1?'P/ a família':'P/ os dois'; }
/* ============ GRUPO ETÁRIO (regras do SCIENCE.md) ============ */
function ageGroup(p){ // 'youth' (<16 anos) · 'woman40' (mulher 40+) · 'adult'
  if(!p) return 'adult';
  var a=p.age||30;
  if(a<16) return 'youth';
  if(p.sex==='F'&&a>=40) return 'woman40';
  return 'adult';
}
function isYouth(u){ return ageGroup((u||DB).cfg.profile)==='youth'; }
function isWoman40(u){ return ageGroup((u||DB).cfg.profile)==='woman40'; }
function isAdultMan(u){ var p=(u||DB).cfg.profile; return !!p&&p.sex==='M'&&ageGroup(p)==='adult'; }
function ageGroupNote(p){ // linha cinzenta por baixo do perfil: que regras se aplicam
  var g=ageGroup(p);
  if(g==='youth') return 'Perfil jovem: técnica antes de carga, sem testes de máximos, sem contagem de calorias. 1–3 séries de 6–15 reps, sempre com 2 na reserva; sono 8–10 h.';
  if(g==='woman40') return 'Perfil mulher 40+: força pesada progressiva, bloco de impacto para os ossos (2–3×/semana), proteína 1,6–2,0 g/kg, creatina 3–5 g/dia; os alvos nunca mudam pelo dia do ciclo — só pelo esforço e sono reportados.';
  return 'Perfil adulto: 2–3 sessões de força/semana a RIR 1–3, 1 sessão de intervalos, 8 000 passos/dia, proteína 1,6–2,2 g/kg; a meta conta à semana, não em dias seguidos.';
}
function refreshAgeNote(){
  var el=document.getElementById('ageNote'); if(!el) return;
  var a=parseInt((document.getElementById('pfAge')||{}).value)||30, sx=(document.getElementById('pfSex')||{}).value||'M';
  el.textContent=ageGroupNote({age:a,sex:sx});
}
function switchUser(id){
  if(!ROOT.users[id]) return;
  ROOT.active=id; DB=ROOT.users[id];
  WK=buildWK(DB.cfg.profile);
  builder=null; curWK=null; save(); renderUsers(); renderNav(); render();
}
function addUser(){ // cria a próxima pessoa livre (B, depois C)
  var free=USER_IDS.filter(function(id){ return !ROOT.users[id]; })[0];
  if(!free){ alert('Já estão criadas 3 pessoas.'); return; }
  ROOT.users[free]=initUser({}); save(); switchUser(free); go('guia');
  setTimeout(function(){ alert('Nova pessoa criada \n\nPreenche o Perfil dela (já aberto em Mais) — sexo, idade, peso e objetivo — e a app aplica as regras certas (jovem, mulher 40+, adulto). Os dados de cada um ficam separados; as refeições podem ser partilhadas.'); },300);
}
function addUserB(){ addUser(); } // compatibilidade
function renderUsers(){
  var el=document.getElementById('userBar'); if(!el) return;
  var others=otherIds();
  var h='<div style="position:relative">'+
   '<button class="uchip on" onclick="var m=document.getElementById(\'uMenu\');m.style.display=m.style.display===\'block\'?\'none\':\'block\'">'+esc(userName(ROOT.active))+' <span style="color:var(--muted)">&#9662;</span></button>'+
   '<div id="uMenu" class="umenu" style="display:none">';
  others.forEach(function(id){ h+='<div onclick="switchUser(\''+id+'\')">'+esc(userName(id))+'</div>'; });
  if(USER_IDS.some(function(id){return !ROOT.users[id];})) h+='<div onclick="addUser()">+ adicionar pessoa</div>';
  h+='<div style="color:var(--muted)" onclick="document.getElementById(\'uMenu\').style.display=\'none\';go(\'guia\')">Editar perfil</div>';
  h+='</div></div>';
  el.innerHTML=h;
}
/* Modos de vida real */
function maintKcal(){
  var bmr=DB.cfg.bmr||2000, pw=DB.cfg.profile?DB.cfg.profile.w:94;
  return Math.round((bmr*1.15+10000*0.00048*pw+150)/50)*50;
}
function macroT(){
  var pw=DB.cfg.profile?DB.cfg.profile.w:94;
  var f=DB.cfg.fatT||Math.max(45,Math.round(0.8*pw));
  var c=Math.max(60,Math.round((effKcal()-DB.cfg.prot*4-f*9)/4));
  return {f:f,c:c};
}
function macroEst(dt){ // consumo estimado: kcal não-proteicas divididas 55/45 entre hidratos e gordura
  var s2=sumFoods(dt);
  var rest=Math.max(0,s2.k-s2.p*4);
  return {c:Math.round(rest*0.55/4), f:Math.round(rest*0.45/9)};
}
function effKcal(){ return (DB.cfg.mode&&DB.cfg.mode!=='normal') ? maintKcal() : DB.cfg.kcal; }
function setMode(m){
  DB.cfg.mode=m;
  if(m==='pausa'||m==='ferias') DB.cfg.lastBreak=today();
  save(); render();
}

/* ============ HELPERS ============ */
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
var curDate = today();
function day(dt){ DB.days[dt]=DB.days[dt]||{foods:[]}; DB.days[dt].foods=DB.days[dt].foods||[]; return DB.days[dt]; }
function fmt(n,d){ return (n==null||isNaN(n))?'—':Number(n).toFixed(d==null?1:d).replace('.',','); }
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }
function toastSave(msg){
  var t=document.createElement('div');
  t.textContent=msg||'Guardado';
  t.style.cssText='position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#000000;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s';
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity='1'; });
  setTimeout(function(){ t.style.opacity='0'; setTimeout(function(){ t.remove(); },300); },1100);
}
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function sumFoods(dt){ var f=day(dt).foods,k=0,p=0; for(var i=0;i<f.length;i++){k+=f[i].k;p+=f[i].p;} return {k:k,p:p}; }
function weights(){ // sorted [date, w]
  var a=[]; for(var dt in DB.days){ if(DB.days[dt].w) a.push([dt,DB.days[dt].w]); }
  a.sort(function(x,y){return x[0]<y[0]?-1:1;}); return a;
}
function avg7(dt){ // 7-day avg of weights up to dt
  var a=weights().filter(function(x){return x[0]<=dt;}).slice(-7);
  if(!a.length) return null;
  var s=0; a.forEach(function(x){s+=x[1];}); return s/a.length;
}
/* Gasto estimado (TDEE): BMR ~2000 (Katch-McArdle, MM 75,6 kg) ×1,15 vida basal
   + passos ×0,045 kcal + treino registado. Estimativa — calibra com a balança. */
var CARDIO={
 passadeira:{lb:'Passadeira inclinada',ll:'inclinação %',def:10,met:function(l){return 3.5+0.55*l;}},
 caminhada:{lb:'Caminhada (rua)',ll:'ritmo km/h (4 calmo · 6 rápido)',def:5,met:function(l){return 0.95*l;}},
 eliptica:{lb:'Elíptica',ll:'resistência (1–20)',def:8,met:function(l){return 4+0.35*l;}},
 bicicleta:{lb:'Bicicleta estática',ll:'resistência (1–20)',def:8,met:function(l){return 3.5+0.45*l;}},
 remo:{lb:'Remo',ll:'resistência (1–10)',def:5,met:function(l){return 6+0.4*l;}},
 corrida:{lb:'Corrida',ll:'velocidade km/h',def:9,met:function(l){return 1.0*l;}},
 intervalos:{lb:'Intervalos (10×1 / 4×4)',ll:'intensidade (1–10)',def:8,met:function(l){return 4+0.7*l;}}
};
var cardioT='passadeira';
function cardioKcal(t,lvl,min){
  var pw=DB.cfg.profile?DB.cfg.profile.w:94;
  var met=Math.min(13,Math.max(2,CARDIO[t].met(lvl)));
  return Math.round(met*3.5*pw/200*min);
}
function cardioSum(dt){
  var d=DB.days[dt]; if(!d||!d.cardio) return 0;
  return d.cardio.reduce(function(a,c){return a+c.k;},0);
}
function addCardio(){
  var t=document.getElementById('cdT').value;
  var lvl=parseFloat(document.getElementById('cdL').value)||CARDIO[t].def;
  var min=parseInt(document.getElementById('cdM').value)||0;
  if(!min) return;
  var k=cardioKcal(t,lvl,min);
  var d=day(curDate); d.cardio=d.cardio||[];
  d.cardio.push({t:t,lvl:lvl,min:min,k:k});
  buzz(); save(); render();
}
function trainBurn(k){
  return Math.round((WKCAL[k]||280)*((DB.cfg.profile?DB.cfg.profile.w:94)/94));
}
var WKCAL = {UA:300,LA:320,UB:300,LB:320,D5:220,MIN:100,FER1:220,FER2:110,PUSH:300,PULL:300,LEGS:320,FBA:310,FBB:310,BA:190,BB:190,SIMA:250,SIMB:250,XPERNA:320,XGLUTE:300,XBRACO:200,XPEITO:250,XCOSTA:260,XOMBRO:200,XCORE:150,REST:0};
function tdee(dt){
  var bmr=DB.cfg.bmr||2000;
  var pw=DB.cfg.profile?DB.cfg.profile.w:94;
  var d=DB.days[dt]||{}, base=bmr*1.15, st=(d.steps||0)*0.00048*pw;
  var wk=DB.workouts[dt];
  var tr=(wk&&wk.type&&wk.type!=='REST')?Math.round((WKCAL[wk.type]||280)*(pw/94)):0;
  return Math.round(base+st+tr+cardioSum(dt));
}
function deficit(dt){
  var s=sumFoods(dt);
  if(!s.k) return null; // sem comida registada não há estimativa honesta
  return Math.round(s.k - tdee(dt));
}
function tonnage(dt){
  var wk=DB.workouts[dt]; if(!wk) return 0;
  var t=0; for(var k in (wk.sets||{})){ (wk.sets[k]||[]).forEach(function(s){ if(s.w&&s.r) t+=s.w*s.r; }); }
  return Math.round(t);
}
function addWater(l){ var d=day(curDate); d.water=Math.max(0,Math.round(((d.water||0)+l)*100)/100); buzz(); save(); render(); }
function weekOf(dt){ return getWeek(new Date(dt+'T12:00:00')); }
function weeklySummary(nWeeks){
  var wkMap={};
  function W(dt){ var w=weekOf(dt); wkMap[w]=wkMap[w]||{w:[],k:[],p:[],df:[],st:[],wa:[],tr:0,ton:0}; return wkMap[w]; }
  for(var dt in DB.days){
    var d=DB.days[dt], o=W(dt);
    if(d.w) o.w.push(d.w);
    var s=sumFoods(dt);
    if(s.k){ o.k.push(s.k); o.p.push(s.p); var df=deficit(dt); if(df!=null) o.df.push(df); }
    if(d.steps) o.st.push(d.steps);
    if(d.water) o.wa.push(d.water);
  }
  for(var dt2 in DB.workouts){ if(DB.workouts[dt2].type==='REST') continue; var o2=W(dt2); var tn=tonnage(dt2); if(tn||DB.workouts[dt2].type){ o2.tr++; o2.ton+=tn; } }
  function m(a){ if(!a.length) return null; var s=0; a.forEach(function(x){s+=x;}); return s/a.length; }
  var keys=Object.keys(wkMap).sort().slice(-nWeeks);
  return keys.map(function(k){
    var o=wkMap[k];
    return {wk:k, peso:m(o.w), kcal:m(o.k), prot:m(o.p), df:m(o.df), steps:m(o.st), water:m(o.wa), treinos:o.tr, ton:o.ton};
  });
}

/* ============ DATA: WORKOUTS ============ */
var WKBASE = {
 UA:{name:'Upper A', ex:[
  {id:'ua1',n:'Supino inclinado halteres',t:'3×6–10',m:'Peito sup. · ombro ant. · tríceps',a:['Supino inclinado máquina/Smith','Supino plano halteres','Flexões pés elevados + colete/mochila']},
  {id:'ua2',n:'Remada máquina/barra',t:'3×8–12',m:'Costas (dorsal, trapézio) · bíceps',a:['Remada unilateral c/ haltere','Remada no cabo sentado','Remada T-bar']},
  {id:'ua3',n:'Press de ombros',t:'2×8–12',m:'Ombros · tríceps',a:['Press halteres sentado','Press máquina de ombros','Landmine press']},
  {id:'ua4',n:'Puxada vertical',t:'2×10–15',m:'Dorsal · bíceps',a:['Pull-ups (ou assistidas)','Puxada unilateral no cabo','Pullover no cabo']},
  {id:'ua5',n:'Curl inclinado',t:'2×8–12',m:'Bíceps (alongado)',a:['Curl no cabo atrás do corpo','Curl halteres em pé','Curl barra/EZ']},
  {id:'ua6',n:'Ext. tríceps acima da cabeça',t:'2×10–15',m:'Tríceps (cabeça longa)',a:['Ext. overhead c/ haltere (2 mãos)','Francês deitado (skullcrusher)','Tríceps corda']}]},

function progOf(p){
  if(typeof DB!=='undefined'&&DB.cfg&&DB.cfg.progSel) return DB.cfg.progSel; // troca rápida no separador Treino
  if(!p) return 'UL';
  if(p.prog&&p.prog!=='auto') return p.prog;
  var d=p.days||4;
  return d<=3?'FB':(d>=5?'PPL':'UL');
}
function setProg(pr){
  DB.cfg.progSel=pr; // null = automático pelo perfil
  WK=buildWK(DB.cfg.profile); curWK=null; save(); render();

  maq:  ['maq','cabo','halt','outro','livre','casa'],

function adaptEx(ex, prof){
  if(!prof) return ex;
  var order=EQUIP_ORDER[prof.equip||'misto']||EQUIP_ORDER.misto;
  var pool=[ex.n].concat(ex.a||[]);
  pool.sort(function(a,b){ return order.indexOf(equipClass(a))-order.indexOf(equipClass(b)); });
  ex.n=pool[0]; ex.a=pool.slice(1);
  // reps: iniciante ou 50+ evita faixas muito pesadas (articulações, técnica)
  if(prof.exp==='iniciante'||prof.age>=50){
    ex.t=ex.t.replace('×5–8','×8–12').replace('×6–10','×8–12');
  }
  if(prof.exp==='avancado'){ ex.t=ex.t.replace('×8–12','×6–10'); }

function youthAdaptEx(ex){

  if(m){
    var sets=Math.min(3,parseInt(m[1])), lo=Math.max(6,Math.min(15,parseInt(m[2]))), hi=Math.max(lo,Math.min(15,parseInt(m[3])));
    if(hi===lo) lo=Math.max(6,hi-5);
    ex.t=sets+'×'+lo+'–'+hi+m[4];

    ex.t=ex.t.replace(/^(\d+)/,function(a){ return String(Math.min(3,parseInt(a))); }).replace(/máx−1/,'8–12');

    var m2=ex.t.match(/^(\d+)×/); if(m2&&parseInt(m2[1])>3) ex.t=ex.t.replace(/^\d+×/,'3×');

function autoTune(){ // devolve sugestão de ajuste de kcal ou null
  var goal=DB.cfg.profile?DB.cfg.profile.goal:'perder';
  if(goal==='manter') return null;
  if(DB.cfg.mode&&DB.cfg.mode!=='normal') return null; // em férias/pausa/doente não se mexe
  if(isYouth()) return null; // jovem: sem calorias, sem auto-ajuste
  // O dia do ciclo nunca altera alvos (SCIENCE.md b) — o campo fica registado, mas o ajuste olha só para esforço e sono
  var fat=recentFatigue();
  if(DB.cfg.lastTune && (new Date(today())-new Date(DB.cfg.lastTune))/86400000 < 14) return null;
  var n14=weights().filter(function(x){return x[0]>=dateOffset(-14);}).length;
  if(n14<8) return null; // dados insuficientes
  var aNow=avg7(today()), a1=avg7(dateOffset(-7)), a2=avg7(dateOffset(-14));
  if(aNow==null||a1==null||a2==null) return null;
  var rate=((aNow-a1)+(a1-a2))/2; // kg/semana, média 2 semanas
  var s=null;
  if(goal==='perder'){
    if(rate>-0.25) s={dir:-150, why:'Ritmo médio '+(rate>0?'+':'')+fmt(rate)+' kg/sem nas últimas 2 semanas — demasiado lento.',
      lever:'Na prática: tira 2 c.s. de arroz (−75) + 1 fruta (−80), OU troca a c.s. de azeite por um fio (−55) e o snack livre por fruta.'};
    else if(rate<-0.9) s={dir:150, why:'Ritmo médio '+fmt(rate)+' kg/sem — demasiado rápido, risco de perder músculo.',
      lever:'Na prática: junta 4 c.s. de arroz (+150) OU 1 fruta + 1 punhado de frutos secos (+205).'};
  } else if(goal==='ganhar'){
    if(rate<0.05) s={dir:150, why:'Peso estagnado ('+fmt(rate)+' kg/sem) — para ganhar precisas de mais.', lever:'Junta 4 c.s. de arroz ou 1 batido extra.'};
    else if(rate>0.45) s={dir:-150, why:'A ganhar '+fmt(rate)+' kg/sem — demasiado rápido, isso já é gordura.', lever:'Tira 2 c.s. de arroz + 1 fruta.'};
  }
  if(s&&s.dir<0&&fat) return null; // esforço no limite ou sono curto: não cortar mais — primeiro recuperar
  if(s) s.novo=Math.max(1500, DB.cfg.kcal+s.dir);

function recentFatigue(){ // últimos 7 dias: ≥2 sessões "difícil"/RIR 0 ou sono médio <6,5 h

  for(var i=0;i<7;i++){ var dt=dateOffset(-i), w=DB.workouts[dt], d=DB.days[dt];
    if(w&&w.type!=='REST'){ var r=sessionRIR(w); if(w.rate==='dificil'||(r!=null&&r<=0)) hard++; }

function sessionRIR(wk){ // RIR médio de uma sessão: séries com rir; senão mapeia a avaliação (fácil 3 · no ponto 2 · difícil 0)
  var rs=[]; for(var k in (wk.sets||{})){ (wk.sets[k]||[]).forEach(function(x){ if(x.w&&x.r&&x.rir!=null) rs.push(x.rir); }); }
  if(rs.length){ var t=0; rs.forEach(function(x){t+=x;}); return t/rs.length; }
  if(wk.rate==='facil') return 3; if(wk.rate==='certo') return 2; if(wk.rate==='dificil') return 0;
  return null;
}

    var w=DB.workouts[dt]; if(!w||w.type==='REST') return;

function coachWeek(){
  var issues=[], avg=function(a){ if(!a.length) return null; var s=0; a.forEach(function(x){s+=x;}); return s/a.length; };
  var kAll=[],kWknd=[],kWkd=[],prots=[],steps=[],sleeps=[],waters=[],weighs=0,logged=0,trainings=0,ton=0;
  for(var i=1;i<=7;i++){
    var dt=dateOffset(-i), d=DB.days[dt];
    if(DB.workouts[dt]&&DB.workouts[dt].type!=='REST'){ trainings++; ton+=tonnage(dt); }
    if(!d) continue;
    var s=sumFoods(dt);
    if(s.k){ logged++; kAll.push(s.k); prots.push(s.p);
      var dow=new Date(dt+'T12:00:00').getDay();
      if(dow===0||dow===5||dow===6) kWknd.push(s.k); else kWkd.push(s.k); }
    if(d.steps) steps.push(d.steps);
    if(d.sleep) sleeps.push(d.sleep);
    if(d.water) waters.push(d.water);
    if(d.w) weighs++;
  }
  if(logged<4) issues.push({e:'Só registaste comida em '+logged+' de 7 dias',
    s:'Sem dados não há coach: regista pelo menos 5 dias — as refeições-tipo levam 5 segundos.'});
  var aK=avg(kAll), aP=avg(prots), KT=DB.cfg.kcal;
  if(aK!=null&&logged>=4){
    if(aK>KT*1.07){
      var wk=avg(kWknd), wd=avg(kWkd);
      if(wk&&wd&&wk>wd*1.2) issues.push({e:'Calorias +'+Math.round(aK-KT)+'/dia — o estouro está na sexta-domingo ('+Math.round(wk)+' vs '+Math.round(wd)+' kcal)',
        s:'Aplica o banco de calorias: pequeno-almoço e almoço só proteína+legumes nos dias de convívio, e teto de 2–3 bebidas.'});
      else issues.push({e:'Calorias +'+Math.round(aK-KT)+'/dia acima do alvo, espalhado pela semana',
        s:'Os suspeitos do costume: azeite a olho e extras não registados. Mede o azeite 1 semana e regista TUDO, mesmo o mau.'});
    }
    if(aK<KT*0.85) issues.push({e:'Calorias muito abaixo do alvo ('+Math.round(aK)+')',
      s:'Défice agressivo demais queima músculo e rebenta ao fim de semana. Come o alvo — é um alvo, não um teto para bater por baixo.'});
    if(aP!=null&&aP<DB.cfg.prot*0.9) issues.push({e:'Proteína média '+Math.round(aP)+' g (alvo '+DB.cfg.prot+')',
      s:'Fixa a 4.ª dose como não-negociável: whey ou skyr antes de deitar, com alarme no relógio às 22h.'});
  }
  if(avg(steps)!=null&&avg(steps)<DB.cfg.steps*0.75) issues.push({e:'Passos: média '+Math.round(avg(steps)).toLocaleString('pt-PT')+' ('+Math.round(avg(steps)/DB.cfg.steps*100)+'% do alvo)',
    s:'Escolhe UMA solução nova do menu esta semana (a mais fácil: 15 min de inclinada no fim de cada treino) e fixa-a.'});
  if(trainings<2&&DB.cfg.mode==='normal') issues.push({e:'Só '+trainings+' treino'+(trainings===1?'':'s')+' esta semana (mínimo 2 de força + 1 cardio/passos)',
    s:'Marca os dias no calendário à segunda-feira, à mesma hora. Dia mau? Sessão Mínima de 12 min — nunca zero.'});
  var ar=autoregulate();
  if(ar) issues.push({e:ar.title, s:ar.txt});
  if(isWoman40()){ // ≥4 semanas com ≥2 sessões: técnica estável → cargas pesadas
    var okW=0; for(var wi=0;wi<8;wi++){ if(weekStats(DB, weekOf(dateOffset(-7*wi))).str>=2) okW++; }
    if(okW>=4) issues.push({e:'Técnica estável há '+okW+' semanas com 2+ sessões',
      s:'Passa a cargas pesadas nos básicos: 5×5 a RIR 1–2 em agachamento, peso morto, press e remada — é o que mais protege osso e músculo depois dos 40 (LIFTMOR).'});
  }
  if(avg(sleeps)!=null&&avg(sleeps)<6.8) issues.push({e:'Sono médio '+fmt(avg(sleeps))+' h',
    s:'Prioridade nº1 da próxima semana: com pouco sono, o mesmo défice perde 55% menos gordura (Nedeltcheva). Alarme de deitar, não só de acordar.'});
  if(avg(waters)!=null&&avg(waters)<DB.cfg.water*0.7) issues.push({e:'Água: média '+fmt(avg(waters))+' L (alvo '+fmt(DB.cfg.water)+')',
    s:'Garrafa de 750 ml sempre à vista: uma de manhã, uma à tarde, + copos às refeições.'});
  if(weighs<3) issues.push({e:'Só '+weighs+' pesagens esta semana',
    s:'Pesa-te 3-4× (manhã, jejum) — a média semanal é o instrumento de navegação; sem ela o auto-ajuste voa às cegas.'});
  // avaliações de treino: fadiga acumulada
  var hard=0,easy=0;
  for(var ri=1;ri<=7;ri++){ var rw=DB.workouts[dateOffset(-ri)]; if(rw&&rw.rate==='dificil') hard++; if(rw&&rw.rate==='facil') easy++; }
  if(hard>=3) issues.push({e:hard+' treinos avaliados como "difícil" esta semana',
    s:'Fadiga a acumular: revê o sono, confirma que comes o alvo (não menos), e considera uma semana de Pausa ou deload (metade das séries, mesma carga).'});
  if(easy>=3) issues.push({e:easy+' treinos avaliados como "fácil"',
    s:'Estás a deixar ganhos na mesa: aproxima as séries da falha (RIR 1–3 a sério) e aceita as subidas de carga que o coach sugere.'});
  // carga vs semana anterior
  var tonPrev=0;
  for(var j=8;j<=14;j++){ var dt2=dateOffset(-j); if(DB.workouts[dt2]) tonPrev+=tonnage(dt2); }
  if(tonPrev>0&&ton>0&&ton<tonPrev*0.85&&DB.cfg.mode==='normal') issues.push({e:'Carga total caiu '+Math.round((1-ton/tonPrev)*100)+'% vs semana anterior',
    s:'Em défice, a força é o alarme do músculo. Revê o sono e considera 150 kcal a mais OU uma semana de Pausa.'});
  return issues;
}
function etaGoal(){
  var t=DB.cfg.target, a=avg7(today());
  if(!t||isYouth()) return null;
  var goal=DB.cfg.profile?DB.cfg.profile.goal:'perder';
  if(goal==='manter') return null;
  if(a==null) a=DB.cfg.startW||(DB.cfg.profile?DB.cfg.profile.w:94.2);
  var diff=goal==='ganhar'?(t-a):(a-t);
  if(diff<=0.2) return {done:true};
  // 1º: ritmo REAL da balança (3 semanas)
  var a3=avg7(dateOffset(-21));
  var rate=(a3!=null)?Math.abs(a-a3)/3:null, src='real';
  if(rate==null||rate<0.08){
    // 2º: projeção pelos consumos e treinos registados (défice médio → kg/sem)
    var dfs=[]; for(var i=0;i<7;i++){ var df=deficit(dateOffset(-i)); if(df!=null) dfs.push(df); }
    if(dfs.length>=3){
      var aDf=0; dfs.forEach(function(x){aDf+=x;}); aDf/=dfs.length;
      var r2=(goal==='ganhar'?aDf:-aDf)*7/7700;
      if(r2>0.08){ rate=Math.min(1.2,r2); src='consumo'; }
    }
  }
  if(rate==null||rate<0.08){ rate=goal==='ganhar'?0.25:0.5; src='plano'; }
  var wks=diff/rate;
  wks+=Math.floor(wks/6); // 1 semana de pausa a cada 6
  var dEnd=new Date(); dEnd.setDate(dEnd.getDate()+Math.round(wks*7));
  var meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return {done:false, diff:diff, rate:rate, src:src, observed:src==='real', wks:Math.round(wks),
    dateTxt:dEnd.getDate()+' '+meses[dEnd.getMonth()]+' '+dEnd.getFullYear()};
}
/* ============ MASCOTE & JORNADA ============ */
function journeyCard(){
  var t=DB.cfg.target; if(!t||isYouth()) return '';
  var goal=DB.cfg.profile?DB.cfg.profile.goal:'perder';
  var startW=DB.cfg.startW||(weights().length?weights()[0][1]:(DB.cfg.profile?DB.cfg.profile.w:94.2));
  var cur=avg7(today()); if(cur==null) cur=startW;
  var span=goal==='ganhar'?(t-startW):(startW-t);
  if(span<=0) return '';
  var done=goal==='ganhar'?(cur-startW):(startW-cur);
  var frac=Math.max(0,Math.min(1,done/span));
  var W=336,H=96,pad=20,mid=56,amp=17;
  function px(f){ return pad+f*(W-2*pad); }
  function py(f){ return mid - Math.sin(f*Math.PI*2.2)*amp*(1-0.35*f) - f*14; }
  function pts(f0,f1){ var s=''; for(var f=f0;f<=f1+0.001;f+=0.02){ s+=px(f).toFixed(1)+','+py(f).toFixed(1)+' '; } return s.trim(); }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">';
  svg+='<polyline points="'+pts(0,1)+'" fill="none" stroke="#CCCCCC" stroke-width="4" stroke-dasharray="1 7" stroke-linecap="round"/>';
  if(frac>0.01) svg+='<polyline points="'+pts(0,frac)+'" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>';
  // marcos por kg
  var nMk=Math.min(12,Math.floor(span));
  for(var k=1;k<nMk;k++){ var fm=k/span;
    if(fm<1) svg+='<circle cx="'+px(fm)+'" cy="'+py(fm)+'" r="3" fill="'+(fm<=frac?'#000000':'#CCCCCC')+'"/>'; }
  svg+='<text x="'+px(0)+'" y="'+(py(0)+16)+'" text-anchor="middle" font-size="10" fill="#7A7A7A">'+fmt(startW)+'</text>';
  svg+='<text x="'+px(1)+'" y="'+(py(1)+16)+'" text-anchor="middle" font-size="10" fill="#7A7A7A">'+fmt(t)+'</text>';
  var isF=DB.cfg.profile&&DB.cfg.profile.sex==='F';
  svg+='<circle class="mascot" cx="'+px(frac)+'" cy="'+py(frac)+'" r="6" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>';
  svg+='</svg>';
  var eta=etaGoal();
  var etaTxt = !eta?'—':(eta.done?'Chegaste':eta.dateTxt);
  var srcTxt = (eta&&!eta.done)?(eta.src==='real'?'ritmo real da balança':(eta.src==='consumo'?'projetado dos teus consumos + treinos':'ritmo planeado — regista para afinar')):'';
  return '<details><summary>A tua jornada — '+fmt(Math.max(0,done))+' kg feitos ('+Math.round(frac*100)+'%)</summary>'+svg+
    '<div class="jstats">'+
    '<span><b>'+fmt(Math.max(0,done))+' kg</b>feitos ('+Math.round(frac*100)+'%)</span>'+
    '<span><b>'+fmt(Math.max(0,span-done))+' kg</b>faltam</span>'+
    '<span><b>'+etaTxt+'</b>'+srcTxt+'</span>'+
    '</div></details>';
}
/* Sugestão de progressão de carga (progressão dupla automática) */
function suggest(exId, tSpec){
  var last=lastPerf(exId); if(!last) return null;
  var m=tSpec.match(/(\d+)×(\d+)[–-](\d+)/); if(!m) return null;
  var lo=parseInt(m[2]), hi=parseInt(m[3]);
  var sets=last.s;
  var maxW=0; sets.forEach(function(s){ if(s.w>maxW) maxW=s.w; });
  if(!maxW) return null;
  var allTop=sets.length>0 && sets.every(function(s){return s.r>=hi;});
  var anyBelow=sets.some(function(s){return s.r<lo;});
  if(allTop){
    var inc = maxW>=60?2.5 : maxW>=20?2 : 1;
    var nw = Math.max(maxW+inc, Math.round(maxW*1.025*2)/2);
    return {t:'up', w:nw, txt:'Sugestão: <b>sobe para '+String(nw).replace('.',',')+' kg</b> — bateste o topo das reps em todas as séries'};
  }
  if(anyBelow) return {t:'hold', w:maxW, txt:'↔️ Mantém '+String(maxW).replace('.',',')+' kg — entra primeiro no intervalo (ou baixa 5% se falhou muito)'};
  return {t:'rep', w:maxW, txt:'Mantém '+String(maxW).replace('.',',')+' kg e tenta <b>+1 rep</b> por série'};
}

var ingSel={}, ingQ='';
function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function ingListHTML(){
  var qs=norm(ingQ).split(/\s+/).filter(Boolean);
  var h='';
  ING.forEach(function(it,i){
    var hay=norm(it.n+' '+(it.t||''));
    if(qs.length && !qs.every(function(w){return hay.indexOf(w)>=0;})) return;
    var c=ingSel[i]||0;
    var gram=/\(100 g\)/.test(it.n);
    var cTxt=c?(c%1?Math.round(c*100)+'g':c):'';
    h+='<div class="foodline"><span class="fi"'+(c?' style="font-weight:700"':'')+'>'+esc(it.n)+'</span>'+
       '<span class="fk">'+it.k+' · '+it.p+'g</span>'+
       (gram?'<button class="mini ghost" style="padding:4px 7px" onclick="ingGrams('+i+')">g</button>':'')+
       '<button class="mini danger" style="'+(c?'':'visibility:hidden')+'" onclick="ingStep('+i+',-1)">−</button>'+
       '<span style="min-width:20px;text-align:center;font-weight:700">'+cTxt+'</span>'+
       '<button class="mini ghost" onclick="ingStep('+i+',1)">+</button></div>';
  });
  return h||'<div class="note">Nada encontrado — usa "Outro alimento" abaixo.</div>';
}
function ingTotalHTML(){
  var tk=0,tp=0,n=0;
  for(var i in ingSel){ tk+=ING[i].k*ingSel[i]; tp+=ING[i].p*ingSel[i]; n+=ingSel[i]; }
  if(!n) return '<div class="note" style="margin-top:6px">Toca + nos ingredientes (ex.: 3× ovo + 1× pão centeio + 1× abacate ¼).</div>';
  return '<div class="row" style="margin-top:8px">'+
    '<button style="flex:1" onclick="ingConfirm(false)">Adicionar prato — '+Math.round(tk)+' kcal · '+Math.round(tp)+'g P</button>'+
    (shareIds().length?'<button class="ghost" onclick="ingConfirm(true)">'+shareLabel()+'</button>':'')+
    '<button class="ghost" onclick="ingConfirm(false,true)">+ guardar</button>'+
    '<button class="ghost" onclick="ingSel={};refreshIng()">limpar</button></div>'+
    '<div class="note" style="margin-top:4px">"+ guardar" adiciona e guarda o prato em "Os meus alimentos" para a próxima vez.</div>';
}
function refreshIng(){
  var l=document.getElementById('ingList'), t=document.getElementById('ingTotal');
  if(l) l.innerHTML=ingListHTML();
  if(t) t.innerHTML=ingTotalHTML();
}
function ingGrams(i){
  var g=parseFloat(prompt('Quantos gramas? (o item é por 100 g)','170'));
  if(!g||g<=0) return;
  ingSel[i]=Math.round(g)/100; refreshIng();
}
function ingStep(i,d){
  ingSel[i]=(ingSel[i]||0)+d;
  if(ingSel[i]<=0) delete ingSel[i];
  refreshIng();
}
function ingConfirm(both, fav){
  var tk=0,tp=0,parts=[];
  for(var i in ingSel){
    tk+=ING[i].k*ingSel[i]; tp+=ING[i].p*ingSel[i];
    var base=ING[i].n.replace(/\s*\(.*\)/,'');
    if(ingSel[i]%1!==0&&/\(100 g\)/.test(ING[i].n)) parts.push(Math.round(ingSel[i]*100)+' g '+base);
    else parts.push((ingSel[i]>1?ingSel[i]+'× ':'')+base);
  }
  if(!tk) return;
  var nm=parts.join(' + ');
  if(fav) DB.custom.push({n:nm,k:Math.round(tk),p:Math.round(tp)});
  if(both&&shareIds().length){
    function factor(u){ return Math.max(0.5, Math.min(1.3, Math.round((u.cfg.kcal||2600)/2600*100)/100)); }
    var fMe=factor(DB);
    day(curDate).foods.push({n:nm+(fMe!==1?' ×'+String(fMe).replace('.',','):''),k:Math.round(tk*fMe),p:Math.round(tp*fMe)});
    shareIds().forEach(function(oid){ var oU=ROOT.users[oid], fOt=factor(oU);
      oU.days[curDate]=oU.days[curDate]||{foods:[]}; oU.days[curDate].foods=oU.days[curDate].foods||[];
      oU.days[curDate].foods.push({n:nm+' ×'+String(fOt).replace('.',','),k:Math.round(tk*fOt),p:Math.round(tp*fOt)}); });
  } else {
    day(curDate).foods.push({n:nm,k:Math.round(tk),p:Math.round(tp)});
  }
  ingSel={}; buzz(); save(); render();
}

var handSel={pa:0,ca:0,go:0,le:0};
function handVals(){
  var isF=DB.cfg.profile&&DB.cfg.profile.sex==='F';
  return { pa:{k:isF?120:160,p:isF?23:30,lb:'Palma de proteína',hint:'carne/peixe do tamanho e grossura da tua palma'},
           ca:{k:isF?100:130,p:isF?2:3,lb:'Punho de hidratos',hint:'arroz/massa/batata do tamanho do teu punho'},
           go:{k:isF?80:100,p:0,lb:'Polegar de gordura',hint:'azeite/queijo/molho do tamanho do polegar'},
           le:{k:25,p:1,lb:'Punho de legumes',hint:'salada/legumes — quase de graça'} };
}
function handHTML(){
  var hv=handVals(), tk=0, tp=0;
  ['pa','ca','go','le'].forEach(function(x){ tk+=hv[x].k*handSel[x]; tp+=hv[x].p*handSel[x]; });
  var h='';
  ['pa','ca','go','le'].forEach(function(x){
    h+='<div class="foodline"><span class="fi"><b>'+hv[x].lb+'</b><br><span style="font-size:11px;color:var(--muted)">'+hv[x].hint+'</span></span>'+
      '<span class="fk">'+hv[x].k+' kcal</span>'+
      '<button class="mini danger" style="'+(handSel[x]?'':'visibility:hidden')+'" onclick="handStep(\''+x+'\',-1)">−</button>'+
      '<span style="min-width:20px;text-align:center;font-weight:700">'+(handSel[x]||'')+'</span>'+
      '<button class="mini ghost" onclick="handStep(\''+x+'\',1)">+</button></div>';
  });
  if(tk) h+='<div class="row" style="margin-top:8px"><button style="flex:1" onclick="handConfirm()">Adicionar — '+Math.round(tk)+' kcal · '+Math.round(tp)+'g P</button>'+
    '<button class="ghost" onclick="handSel={pa:0,ca:0,go:0,le:0};refreshHand()">limpar</button></div>';
  return h;
}
function refreshHand(){ var el=document.getElementById('handBox'); if(el) el.innerHTML=handHTML(); }
function handStep(x,d){ handSel[x]=Math.max(0,(handSel[x]||0)+d); refreshHand(); }
function handConfirm(){
  var hv=handVals(), tk=0, tp=0, parts=[];
  var names={pa:'palma prot.',ca:'punho hidratos',go:'polegar gord.',le:'punho legumes'};
  ['pa','ca','go','le'].forEach(function(x){ if(handSel[x]){ tk+=hv[x].k*handSel[x]; tp+=hv[x].p*handSel[x]; parts.push(handSel[x]+'× '+names[x]); } });
  if(!tk) return;
  day(curDate).foods.push({n:'Prato à mão: '+parts.join(' + '),k:Math.round(tk),p:Math.round(tp)});
  handSel={pa:0,ca:0,go:0,le:0}; buzz(); save(); render();
}

var PL={wk:null,idx:0,rest:0,timer:null,rir:null};
function startSession(wkKey){
  if(!WK[wkKey]) return;
  DB.workouts[curDate]=DB.workouts[curDate]||{type:wkKey,sets:{}};
  DB.workouts[curDate].type=wkKey; save();
  PL={wk:wkKey,idx:0,rest:0,timer:null,rir:null};
  var d=document.createElement('div'); d.className='player'; d.id='player';
  document.body.appendChild(d);
  renderPlayer();
}
function endSession(){
  if(PL.timer) clearInterval(PL.timer);
  var p=document.getElementById('player'); if(p) p.remove();

}
function plExs(){ return sessionExs(PL.wk, curDate).filter(function(e){return e.t!=='—';}); }
function plSetRIR(v){ PL.rir=v; renderPlayer(); }

  var h='<div class="psets" style="align-items:center"><span style="font-size:12px;color:var(--muted)">RIR</span>';
  for(var i=0;i<=4;i++) h+='<button class="mini'+(cur===i?'':' ghost')+'" style="min-width:40px;padding:6px 0" onclick="plSetRIR('+i+')">'+i+'</button>';

function plRate(r){ DB.workouts[curDate].rate=r; buzz(); save(); renderPlayer(); }
function plLogSet(){
  var w=parseFloat(document.getElementById('plW').value)||null;
  var r=parseInt(document.getElementById('plR').value)||null;
  if(!w||!r) return;
  var ex=plExs()[PL.idx];
  var wk=DB.workouts[curDate]; wk.sets[ex.id]=wk.sets[ex.id]||[];
  var setObj={w:w,r:r}; if(PL.rir!=null) setObj.rir=PL.rir;
  wk.sets[ex.id].push(setObj); buzz(); save();
  // autorregulação: recomendar a carga da PRÓXIMA série com base na que acabaste
  PL.rec=null; PL.recEx=ex.id;
  var mm=ex.t.match(/×(\d+)–(\d+)/);
  if(mm){
    var lo=parseInt(mm[1]), hi=parseInt(mm[2]);
    var inc=w>=60?2.5:(w>=20?2:1);
    if(isYouth()&&r>hi) PL.rec={w:roundW(Math.max(w+inc,w*1.05)), a:'↑', txt:r+' reps — sobe pouco (≤5 %) e só se a técnica se manteve; deixa 2 na reserva'};
    else if(r>=hi+3) PL.rec={w:roundW(Math.max(w+inc*2,w*1.05)), a:'↑↑', txt:r+' reps — demasiado fácil, sobe a sério'};
    else if(r>hi)    PL.rec={w:roundW(Math.max(w+inc,w*1.025)), a:'↑', txt:r+' reps — passaste o alvo ('+lo+'–'+hi+'), sobe'};
    else if(r<lo)    PL.rec={w:Math.max(1,roundW(w*0.92)), a:'↓', txt:'só '+r+' reps (alvo '+lo+'–'+hi+') — baixa e salva a próxima'};

function walkRoute(steps){
  function go(lat,lng){
    var stride=(DB.cfg.profile&&DB.cfg.profile.sex==='F')?0.70:0.76; // metros por passo

    var r=dist/3.4;                      // raio do triângulo (perímetro ≈ 3,4r nas ruas)
    var br=Math.random()*2*Math.PI;      // sentido sorteado
    function off(bearing,d){
      var dLat=d*Math.cos(bearing)/111111;
      var dLng=d*Math.sin(bearing)/(111111*Math.cos(lat*Math.PI/180));
      return (lat+dLat).toFixed(6)+','+(lng+dLng).toFixed(6);
    }

function dayImpact(){
  var goal=DB.cfg.profile?DB.cfg.profile.goal:'perder';
  var df=deficit(curDate);
  if(df==null||DB.cfg.mode!=='normal'||goal==='manter') return null;
  var planned=goal==='ganhar'?250:500;
  var actual=goal==='ganhar'?df:-df;
  var ratio=actual/planned;
  if(ratio>=0.8&&ratio<=1.4) return {t:'ok', txt:'Dia no ritmo — a data da meta mantém-se.'};
  if(ratio<0.8){
    var atraso=Math.max(0.1,Math.round((planned-actual)/planned*10)/10);
    return {t:'atraso', txt:'Este dia empurra a meta ~'+String(atraso).replace('.',',')+' dia'+(atraso>=1.5?'s':'')+' para a frente. Um dia não é nada — dois seguidos é tendência.'};
  }
  return {t:'frente', txt:'À frente do plano (défice '+Math.round(actual)+'). Ganhas ~'+String(Math.round((actual-planned)/planned*10)/10).replace('.',',')+' dia — mas défices muito grandes comem músculo; não faças disto hábito.'};

function protSuggest(){
  var s2=sumFoods(curDate); var miss=DB.cfg.prot-s2.p;
  if(miss<15||!s2.k) return null;
  var kcalLeft=effKcal()-s2.k;
  var items=[
    {n:'whey 1 scoop',p:22,k:119,max:2},
    {n:'skyr 1 pote',p:16,k:86,max:2},
    {n:'atum 1 lata pequena',p:21,k:88,max:2},
    {n:'frango 100 g',p:29,k:150,max:2},
    {n:'YoPro líquido',p:25,k:170,max:1},
    {n:'quark 100 g',p:12,k:67,max:1},
    {n:'2 ovos',p:13,k:146,max:1}
  ];
  var combo={},tp=0,tk=0,g=0;
  while(tp<miss-5&&g<12){
    g++;
    var pick=null;
    for(var i=0;i<items.length;i++){
      var it=items[i];
      if((combo[it.n]||0)>=it.max) continue;
      if(kcalLeft>0 && (tk+it.k)>kcalLeft+120) continue; // não rebenta as kcal (margem 120)
      pick=it; break;
    }
    if(!pick) break;
    combo[pick.n]=(combo[pick.n]||0)+1; tp+=pick.p; tk+=pick.k;
  }
  if(!tp) return null;
  var parts=Object.keys(combo).map(function(n){return (combo[n]>1?combo[n]+'× ':'')+n;});
  return {txt:parts.join(' + '), p:Math.round(tp), k:Math.round(tk), miss:Math.round(miss)};
}

  if(!tk){ builder=null; render(); return; }

  var me=ROOT.active, others=shareIds();
  if(!others.length){ confirmBuilder(); return; }
  // fator de cada um: alvo próprio ÷ 2600 (as refeições-tipo foram construídas para 2600 kcal)
  function factor(u){ var kc=(u.cfg.mode&&u.cfg.mode!=='normal')?null:u.cfg.kcal; kc=kc||u.cfg.kcal||2600;
    return Math.max(0.5, Math.min(1.3, Math.round(kc/2600*100)/100)); }
  var fMe=factor(DB), fSum=fMe, msg='Registado \n\n'+userName(me)+': '+Math.round(tk*fMe)+' kcal · '+Math.round(tp*fMe)+'g P (×'+fMe+')';
  day(curDate).foods.push({n:nm+(fMe!==1?' ×'+String(fMe).replace('.',','):''),k:Math.round(tk*fMe),p:Math.round(tp*fMe)});
  others.forEach(function(other){

    oU.days[curDate]=oU.days[curDate]||{foods:[]}; oU.days[curDate].foods=oU.days[curDate].foods||[];
    oU.days[curDate].foods.push({n:nm+(fOt!==1?' ×'+String(fOt).replace('.',','):''),k:Math.round(tk*fOt),p:Math.round(tp*fOt)});
    msg+='\n'+userName(other)+': '+Math.round(tk*fOt)+' kcal · '+Math.round(tp*fOt)+'g P (×'+fOt+') — ≈ '+Math.round(fOt/fMe*100)+'% da dose de '+userName(me)+
      ' (6 c.s. de arroz → '+Math.max(1,Math.round(6*fOt/fMe))+' c.s. · 200 g de proteína → '+Math.round(200*fOt/fMe/10)*10+' g)';
  });
  builder=null; save(); render();
  alert(msg+'\n\nCozinha a receita ×'+(Math.round(fSum*10)/10)+' e divide nessa proporção.');
}

var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtDataPt(dt){ var d=new Date(dt+'T12:00:00'); return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear(); }
function exStats(exId){
  var ids=canonList(exId), best=null, bestRM=null, lastD=null, nSes=0;
  Object.keys(DB.workouts).sort().forEach(function(dt){
    var found=false;
    ids.forEach(function(id){
      var sets=DB.workouts[dt].sets&&DB.workouts[dt].sets[id];
      if(!sets) return;
      sets.forEach(function(x){
        if(!x.w||!x.r) return;
        found=true;
        if(!best||x.w>best.w||(x.w===best.w&&x.r>best.r)) best={w:x.w,r:x.r,d:dt};
        var rm=x.w*(1+x.r/30);
        if(!bestRM||rm>bestRM.rm) bestRM={rm:Math.round(rm*10)/10,d:dt};
      });
    });
    if(found){ nSes++; lastD=dt; }
  });
  if(!best) return null;
  return {best:best,bestRM:bestRM,lastD:lastD,nSes:nSes};
}
function lastPerf(exId){
  var dates=Object.keys(DB.workouts).sort().reverse();
  for(var i=0;i<dates.length;i++){
    if(dates[i]>=curDate) continue;
    var ids=canonList(exId);
    for(var ci=0;ci<ids.length;ci++){
      var s=DB.workouts[dates[i]].sets[ids[ci]];
      if(s&&s.length&&s.some(function(x){return x.w&&x.r;})) return {d:dates[i],s:s.filter(function(x){return x.w&&x.r;})};
    }
  }
  return null;
}

function impData(inp){
  var f=inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ try{
    var parsed=JSON.parse(r.result);
    var soAtivo = !confirm('Este backup vai para onde?\n\nOK = substituir a APP TODA (as duas pessoas)\nCancelar = importar SÓ para a pessoa ativa ('+userName(ROOT.active)+') — usa isto para trazer os dados dela para o teu telemóvel');
    if(parsed.users){
      if(soAtivo){ var src=parsed.users[parsed.active&&parsed.users[parsed.active]?parsed.active:'A']||{}; ROOT.users[ROOT.active]=src; }
      else { ROOT=parsed; ROOT.active=(ROOT.active&&ROOT.users[ROOT.active])?ROOT.active:'A'; }
    }
    else { ROOT.users[ROOT.active]=parsed; } // backup antigo (1 pessoa)
    for(var uk in ROOT.users) initUser(ROOT.users[uk]);
    DB=ROOT.users[ROOT.active];
    WK=buildWK(DB.cfg.profile);
    save(); renderUsers(); render();
  }catch(e){ alert('Ficheiro inválido'); } };
  r.readAsText(f);
}
function addPhoto(inp){
  var f=inp.files[0]; if(!f) return;
  var img=new Image(), rd=new FileReader();
  rd.onload=function(){ img.src=rd.result; };
  img.onload=function(){
    var W=360, H=Math.round(img.height*W/img.width);
    var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    cv.getContext('2d').drawImage(img,0,0,W,H);
    var data=cv.toDataURL('image/jpeg',0.6);
    DB.photos=DB.photos||[];
    DB.photos.push({d:today(), img:data});
    while(DB.photos.length>12) DB.photos.shift();
    try{ save(); }catch(e){ DB.photos.pop(); alert('Sem espaço para mais fotos — apaga algumas.'); }
    render();
  };
  rd.readAsDataURL(f);
}

/* ============ CHARTS (SVG) ============ */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function lineChart(elId, pts, avgPts, targetY, yLabel){
  var el=document.getElementById(elId); if(!el) return;
  var W=el.clientWidth||320, H=180, padL=34, padR=10, padT=10, padB=20;
  if(!pts.length){ el.innerHTML='<div class="note">Regista o peso alguns dias e o gráfico aparece aqui.</div>'; return; }
  var ys=pts.map(function(p){return p[1];}).concat(targetY?[targetY]:[]);
  var ymin=Math.floor(Math.min.apply(null,ys)-0.5), ymax=Math.ceil(Math.max.apply(null,ys)+0.5);
  var n=pts.length;
  function X(i){ return padL+(n===1?0.5:(i/(n-1)))*(W-padL-padR); }
  function Y(v){ return padT+(1-(v-ymin)/(ymax-ymin))*(H-padT-padB); }
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  // gridlines: 3 clean ticks
  var step=Math.max(1,Math.round((ymax-ymin)/3));
  for(var g=ymin;g<=ymax;g+=step){
    s+='<line x1="'+padL+'" y1="'+Y(g)+'" x2="'+(W-padR)+'" y2="'+Y(g)+'" stroke="'+css('--grid')+'" stroke-width="1"/>';
    s+='<text x="'+(padL-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-size="10" fill="'+css('--muted')+'" style="font-variant-numeric:tabular-nums">'+g+'</text>';
  }
  if(targetY){
    s+='<line x1="'+padL+'" y1="'+Y(targetY)+'" x2="'+(W-padR)+'" y2="'+Y(targetY)+'" stroke="'+css('--muted')+'" stroke-width="1" stroke-dasharray="4 3"/>';
    s+='<text x="'+(W-padR)+'" y="'+(Y(targetY)-4)+'" text-anchor="end" font-size="10" fill="'+css('--ink2')+'">alvo '+fmt(targetY)+'</text>';
  }
  // raw points (muted, small, surface ring)
  pts.forEach(function(p,i){
    s+='<circle cx="'+X(i)+'" cy="'+Y(p[1])+'" r="3" fill="'+css('--muted')+'" stroke="'+css('--card')+'" stroke-width="2"/>';
  });
  // 7d avg line (series blue, 2px)
  if(avgPts&&avgPts.length>1){
    var d='';
    avgPts.forEach(function(p,i){ d+=(i?'L':'M')+X(p[0])+' '+Y(p[1])+' '; });
    s+='<path d="'+d+'" fill="none" stroke="'+css('--s1')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var lp=avgPts[avgPts.length-1];
    s+='<circle cx="'+X(lp[0])+'" cy="'+Y(lp[1])+'" r="4" fill="'+css('--s1')+'" stroke="'+css('--card')+'" stroke-width="2"/>';
    s+='<text x="'+Math.min(X(lp[0]),W-padR-30)+'" y="'+(Y(lp[1])-8)+'" text-anchor="middle" font-size="11" font-weight="600" fill="'+css('--ink')+'">'+fmt(lp[1])+'</text>';
  }
  s+='</svg>';
  el.innerHTML=s;
}
function barChart(elId, bars, target, unit){
  var el=document.getElementById(elId); if(!el) return;
  var W=el.clientWidth||320, H=160, padL=34, padR=10, padT=10, padB=24;
  if(!bars.length){ el.innerHTML='<div class="note">Regista comida alguns dias e aparece aqui a média semanal.</div>'; return; }
  var ymax=Math.max.apply(null,bars.map(function(b){return b.v;}).concat([target||0]))*1.15;
  var bw=Math.min(24,(W-padL-padR)/bars.length-6);
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  function Y(v){ return padT+(1-v/ymax)*(H-padT-padB); }
  [0,Math.round(ymax/2),Math.round(ymax)].forEach(function(g){
    s+='<line x1="'+padL+'" y1="'+Y(g)+'" x2="'+(W-padR)+'" y2="'+Y(g)+'" stroke="'+css('--grid')+'" stroke-width="1"/>';
    s+='<text x="'+(padL-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-size="10" fill="'+css('--muted')+'" style="font-variant-numeric:tabular-nums">'+g+'</text>';
  });
  if(target) s+='<line x1="'+padL+'" y1="'+Y(target)+'" x2="'+(W-padR)+'" y2="'+Y(target)+'" stroke="'+css('--muted')+'" stroke-width="1" stroke-dasharray="4 3"/>';
  bars.forEach(function(b,i){
    var x=padL+(i+0.5)*((W-padL-padR)/bars.length)-bw/2, y=Y(b.v);
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+(H-padB-y)+'" rx="4" ry="4" fill="'+css('--s1')+'"/>';
    s+='<rect x="'+x+'" y="'+(H-padB-2)+'" width="'+bw+'" height="2" fill="'+css('--s1')+'"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-padB+13)+'" text-anchor="middle" font-size="9.5" fill="'+css('--muted')+'">'+b.lb+'</text>';
    if(i===bars.length-1) s+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="'+css('--ink')+'">'+Math.round(b.v)+'</text>';
  });
  s+='</svg>';
  el.innerHTML=s;
}

        '<div class="stat"><span class="lb">1RM estimado</span><span class="vl" style="font-size:17px">'+String(st.bestRM.rm).replace('.',',')+' kg</span><span class="dl">'+fmtDataPt(st.bestRM.d)+'</span></div>'+
        '<div class="stat"><span class="lb">Sessões</span><span class="vl" style="font-size:17px">'+st.nSes+'</span><span class="dl">última: '+fmtDataPt(st.lastD)+'</span></div>'+
        '</div>'
      : '<div class="note">Ainda sem registos deste exercício.</div>';
  }
  var pts=[], cIds=canonList(exId);
  Object.keys(DB.workouts).sort().forEach(function(dt){
    var best=0;
    cIds.forEach(function(cid){
      var s=DB.workouts[dt].sets&&DB.workouts[dt].sets[cid]; if(!s) return;
      s.forEach(function(x){ if(x.w&&x.r){ var rm=x.w*(1+x.r/30); if(rm>best) best=rm; } });
    });
    if(best) pts.push([dt,Math.round(best*10)/10]);
  });
  var el=document.getElementById('chS');
  if(pts.length<1){ el.innerHTML='<div class="note">Regista treinos com cargas e a curva de força aparece aqui.</div>'; return; }
  var idx=pts.map(function(p,i){return [i,p[1]];});
  lineChart('chS', pts, idx, null);
}
function getWeek(d){
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var dn=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dn+3);
  var f=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  var w=1+Math.round(((t-f)/86400000-3+((f.getUTCDay()+6)%7))/7);
  return t.getUTCFullYear()+'-'+String(w).padStart(2,'0');
}

/* verificador de atualizações: compara a versão em memória com a do servidor */
function checkUpdate(){
  if(location.protocol!=='https:') return;
  fetch(location.pathname,{cache:'no-store'}).then(function(r){return r.text();}).then(function(txt){
    var m=txt.match(/APPV='(v\d+)'/);
    if(m&&m[1]!==APPV){
      if(document.getElementById('updBar')) return;
      var d=document.createElement('div');
      d.id='updBar';
      d.innerHTML='Nova versão <b>'+m[1]+'</b> disponível — toca aqui para atualizar';
      d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:999;background:#000000;color:#fff;padding:12px 16px;font-size:14px;text-align:center;cursor:pointer';
      d.onclick=function(){ location.replace(location.pathname+'?u='+m[1]+'-'+Math.floor(Math.random()*1e6)); };
      document.body.appendChild(d);
    }
  }).catch(function(){});
}
checkUpdate();
document.addEventListener('visibilitychange',function(){ if(!document.hidden) checkUpdate(); });
